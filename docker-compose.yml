services:
  postgres:
    image: postgres:16-alpine
    container_name: kosvia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kosvia
      POSTGRES_PASSWORD: kosvia
      POSTGRES_DB: kosvia
    ports:
      - '5433:5432'
    volumes:
      - kosvia-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kosvia -d kosvia']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kosvia-pgdata:
